[project]
name = "pool-prices"
version = "0.1.0"
description = "Async service that returns DEX swap quotes across pools, ranked best to worst"
readme = "README.md"
authors = [
    { name = "MrBeliaev", email = "mr.beliaev88@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
